<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Posted Jobs</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
  <h1 class="text-lg font-semibold text-gray-800">Your Jobs</h1>

  <a th:href="@{/recruiterDashboard}"
     class="text-sm text-indigo-600 font-medium hover:underline">
    Dashboard
  </a>
</nav>

<!-- Container -->
<div class="max-w-5xl mx-auto mt-10 px-4">

  <!-- Title -->
  <h2 class="text-xl font-semibold text-gray-800 mb-6">
    Your Posted Jobs
  </h2>

  <!-- Empty State -->
  <div th:if="${#lists.isEmpty(jobs)}"
       class="bg-white rounded-2xl shadow-md p-10 text-center text-gray-500">
    You haven't posted any jobs yet.
  </div>

  <!-- Job Cards -->
  <div th:if="${!#lists.isEmpty(jobs)}"
       class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div th:each="job : ${jobs}"
         class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between">

      <!-- Job Info -->
      <div>
        <h3 class="text-lg font-semibold text-gray-800 mb-1"
            th:text="${job.title}">
        </h3>

        <p class="text-sm text-gray-500 mb-3"
           th:text="${job.description}">
        </p>

        <p class="text-xs text-gray-400">
          Job ID: <span th:text="${job.id}"></span>
        </p>
      </div>

      <!-- Action -->
      <form th:action="@{/seeApplications}" class="mt-4">
        <input type="hidden" name="id" th:value="${job.id}">

        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium
                         hover:bg-indigo-700 transition">
          See Applications
        </button>
      </form>

    </div>

  </div>

</div>

</body>
</html>
