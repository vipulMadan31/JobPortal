<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-100 via-white to-blue-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">

  <!-- Title -->
  <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
    Create Account
  </h2>

  <!-- Error Message -->
  <div th:if="${emailError}"
       class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm">
    This email already exists
  </div>

  <!-- Form -->
  <form th:action="@{/save}" th:object="${user}" method="post" class="space-y-5">

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Name
      </label>
      <input type="text" th:field="*{name}"
             placeholder="Enter your name"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none">
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input type="text" th:field="*{email}"
             placeholder="Enter your email"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none">
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Password
      </label>
      <input type="password" th:field="*{password}"
             placeholder="Enter your password"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none">
    </div>

    <!-- Role -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Role
      </label>
      <select th:field="*{role}"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        <option value="" disabled selected>-- Select Role --</option>
        <option value="ROLE_JOB_SEEKER">Job Seeker</option>
        <option value="ROLE_RECRUITER">Recruiter</option>
      </select>
    </div>

    <!-- Submit -->
    <button type="submit"
            class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">
      Register
    </button>

  </form>

  <!-- Footer -->
  <p class="text-sm text-gray-500 text-center mt-6">
    Already have an account?
    <a href="/login" class="text-indigo-600 font-medium hover:underline">Login</a>
  </p>

</div>

</body>
</html>
