<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Status</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">

  <!-- Message -->
  <p th:text="${message}"
     class="text-gray-800 text-lg font-medium mb-6">
  </p>

  <!-- Button -->
  <a th:href="@{/jobSeekerDashboard}"
     class="inline-block bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium
              hover:bg-indigo-700 transition">
    Go to Dashboard
  </a>

</div>

</body>
</html>
