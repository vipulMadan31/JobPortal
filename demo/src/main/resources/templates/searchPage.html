<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Search Jobs</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-lg font-semibold text-gray-800">Job Portal</h1>

    <a th:href="@{/jobSeekerDashboard}"
       class="text-sm text-indigo-600 font-medium hover:underline">
        Dashboard
    </a>
</nav>

<!-- Container -->
<div class="max-w-3xl mx-auto mt-16 px-4">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">

        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Find Your Next Job 🚀
        </h2>

        <!-- Form -->
        <form th:action="@{/seeJobs}" method="get" class="space-y-5">

            <!-- Search Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Search
                </label>
                <input type="text" name="keyword"
                       placeholder="Job title or location"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                  focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            </div>

            <!-- Sort -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Sort By
                </label>
                <select name="sort"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                   bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                    <option value="">Default</option>
                    <option value="Salary">Salary (High to Low)</option>
                </select>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold
                               hover:bg-indigo-700 transition duration-200">
                Search Jobs
            </button>

        </form>

    </div>

</div>

</body>
</html>
