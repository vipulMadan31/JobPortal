<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Post Job</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
  <h1 class="text-lg font-semibold text-gray-800">Recruiter Panel</h1>

  <a th:href="@{/logout}"
     class="text-sm text-red-500 font-medium hover:underline">
    Logout
  </a>
</nav>

<!-- Container -->
<div class="max-w-3xl mx-auto mt-10 px-4">

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-xl p-8">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
      Post a New Job
    </h2>

    <!-- Form -->
    <form th:action="@{/saveJob}" th:object="${job}" method="post" class="space-y-5">

      <!-- Hidden recruiter -->
      <input type="hidden" th:field="*{recruiter}">

      <!-- Job Title -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Job Title
        </label>
        <input type="text" th:field="*{title}"
               placeholder="Enter job title"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg
                        focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Description
        </label>
        <textarea th:field="*{description}"
                  rows="4"
                  placeholder="Enter job description"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg
                           focus:ring-2 focus:ring-indigo-400 focus:outline-none"></textarea>
      </div>

      <!-- Salary + Location (Grid) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Salary -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Salary
          </label>
          <input type="number" th:field="*{salary}"
                 placeholder="Enter salary"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg
                          focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>

        <!-- Location -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Location
          </label>
          <input type="text" th:field="*{location}"
                 placeholder="Enter location"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg
                          focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>

      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold
                       hover:bg-indigo-700 transition duration-200">
        Post Job
      </button>

    </form>

  </div>

</div>

</body>
</html>
