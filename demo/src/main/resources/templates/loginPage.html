<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

<!-- Card -->
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
        Welcome Back
    </h2>

    <!-- Error -->
    <div th:if="${param.error}"
         class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm text-center">
        Invalid Username or Password
    </div>

    <!-- Form -->
    <form th:action="@{/authenticateTheUser}" method="POST" class="space-y-5">

        <!-- Username -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Username
            </label>
            <input type="text" name="username"
                   placeholder="Enter your username"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg
                              focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>

        <!-- Password -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Password
            </label>
            <input type="password" name="password"
                   placeholder="Enter your password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg
                              focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold
                           hover:bg-indigo-700 transition duration-200">
            Login
        </button>

    </form>

    <!-- Register Redirect -->
    <form th:action="@{/register}" class="mt-5">
        <button type="submit"
                class="w-full text-indigo-600 font-medium hover:underline text-sm">
            New User? Register here
        </button>
    </form>

</div>

</body>
</html>
