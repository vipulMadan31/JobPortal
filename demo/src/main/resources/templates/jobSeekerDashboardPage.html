<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-lg font-semibold text-gray-800">Job Portal</h1>

    <a th:href="@{/logout}"
       class="text-sm text-red-500 font-medium hover:underline">
        Logout
    </a>
</nav>

<!-- Main Container -->
<div class="max-w-4xl mx-auto mt-10 px-4">

    <!-- Welcome Card -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
        <h2 class="text-xl font-semibold text-gray-800">
            Welcome,
            <span th:text="${jobSeeker.user.name}"></span> 👋
        </h2>
        <p class="text-gray-500 mt-1">
            Manage your profile and explore opportunities
        </p>
    </div>

    <!-- Error Messages -->
    <div th:if="${ResumeError}"
         class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm">
        The file is empty
    </div>

    <div th:if="${resumeSizeError}"
         class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm">
        The resume size exceeds 5MB (too large)
    </div>

    <!-- Actions Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- See Jobs -->
        <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                Explore Jobs
            </h3>
            <p class="text-gray-500 text-sm mb-4">
                Browse and apply to available job opportunities
            </p>

            <form th:action="@{/search}">
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
                    See Jobs
                </button>
            </form>
        </div>

        <!-- Resume Section -->
        <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between">

            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                Resume
            </h3>

            <!-- Upload Resume -->
            <form th:if="${jobSeeker.resume == null}"
                  th:action="@{/uploadResume}"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-3">

                <input type="file" name="file"
                       class="w-full text-sm border border-gray-300 rounded-lg p-2">

                <button type="submit"
                        class="w-full bg-green-600 text-white py-2 rounded-lg font-medium hover:bg-green-700 transition">
                    Upload Resume
                </button>
            </form>

            <!-- View Resume -->
            <form th:if="${jobSeeker.resume != null}"
                  th:action="@{/viewResume}"
                  target="_blank">

                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">
                    View Resume
                </button>
            </form>
        </div>

        <!-- Application History -->
        <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                Applications
            </h3>
            <p class="text-gray-500 text-sm mb-4">
                Track your job applications and status
            </p>

            <form th:action="@{/seeApplicationHistory}">
                <button type="submit"
                        class="w-full bg-purple-600 text-white py-2 rounded-lg font-medium hover:bg-purple-700 transition">
                    See Application History
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
