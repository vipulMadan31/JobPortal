<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Applications</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
  <h1 class="text-lg font-semibold text-gray-800">Applications</h1>

  <a th:href="@{/recruiterDashboard}"
     class="text-sm text-indigo-600 font-medium hover:underline">
    Dashboard
  </a>
</nav>

<!-- Container -->
<div class="max-w-6xl mx-auto mt-10 px-4">

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-md p-6">

    <h2 class="text-xl font-semibold text-gray-800 mb-4">
      Applications for this Job
    </h2>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(applications)}"
         class="text-center text-gray-500 py-10">
      No applications yet.
    </div>

    <!-- Table -->
    <div th:if="${!#lists.isEmpty(applications)}" class="overflow-x-auto">

      <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">

        <!-- Header -->
        <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">ID</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">Name</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">Email</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">College</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">Status</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">Update</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">Resume</th>
        </tr>
        </thead>

        <!-- Body -->
        <tbody class="divide-y">

        <tr th:each="app : ${applications}" class="hover:bg-gray-50">

          <td class="px-4 py-2 text-sm text-gray-600" th:text="${app.id}"></td>

          <td class="px-4 py-2 text-sm font-medium text-gray-800"
              th:text="${app.jobSeeker.user.name}"></td>

          <td class="px-4 py-2 text-sm text-gray-600"
              th:text="${app.jobSeeker.user.email}"></td>

          <td class="px-4 py-2 text-sm text-gray-600"
              th:text="${app.jobSeeker.college}"></td>

          <!-- Status Badge -->
          <td class="px-4 py-2 text-sm">
                <span th:text="${app.status}"
                      class="px-2 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-700">
                </span>
          </td>

          <!-- Update Status -->
          <td class="px-4 py-2 text-sm">

            <form th:action="@{/updateApplicationStatus}" method="post" class="flex gap-2 items-center">

              <input type="hidden" name="applicationId" th:value="${app.id}"/>

              <select name="status"
                      class="border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-400">

                <option value="InProcess" th:selected="${app.status == 'InProcess'}">In Process</option>
                <option value="Shortlisted" th:selected="${app.status == 'Shortlisted'}">Shortlisted</option>
                <option value="Selected" th:selected="${app.status == 'Selected'}">Selected</option>
              </select>

              <button type="submit"
                      class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-indigo-700 transition">
                Update
              </button>

            </form>

          </td>

          <!-- Resume -->
          <td class="px-4 py-2 text-sm">

            <form th:if="${app.jobSeeker.resume != null}"
                  th:action="@{/viewApplicantResume}"
                  target="_blank">

              <input type="hidden" th:value="${app.jobSeeker.id}" name="id">

              <button type="submit"
                      class="bg-green-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-green-700 transition">
                View Resume
              </button>

            </form>

            <span th:if="${app.jobSeeker.resume == null}"
                  class="text-gray-400 text-xs">
                  Not available
                </span>

          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

</body>
</html>
